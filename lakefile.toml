name = "collatz-cryptid"
version = "0.1.0"
keywords = ["math"]
# Lean source lives under lean/ (Python sim code sits at the repo root). Only the Lake
# config trio (this file, lean-toolchain, lake-manifest.json) is hoisted to the root so the
# fleet tooling's git-root == lake-dir assumption holds; srcDir keeps the modules buried.
srcDir = "lean"
defaultTargets = ["Collatz"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "Collatz"

# comparator harness (Comparator/<Result>/{Challenge,Solution}.lean at the repo root).
# Not in defaultTargets and not imported by the main lib: challenge files carry `sorry` by design.
# Built on demand (`lake build Comparator`) and in CI (.github/workflows/comparator.yml).
# srcDir is relative to the package srcDir ("lean"), so ".." puts the module root at the repo root.
[[lean_lib]]
name = "Comparator"
srcDir = ".."
globs = ["Comparator.+"]
